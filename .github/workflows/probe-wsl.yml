name: probe-wsl
on: push
jobs:
  wsl:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WSL_UTF8: "1"
    steps:
      - run: wsl --version; wsl --status; $LASTEXITCODE = 0
      - run: wsl --update --web-download; wsl --version
      - run: wsl --install -d Debian --no-launch --web-download; wsl -l -v
      - run: wsl -d Debian -u root -- bash -c "cat /etc/os-release; uname -a; ps -p 1 -o comm= ; cat /proc/version"
      - run: |
          wsl -d Debian -u root -- bash -c "printf '[boot]\nsystemd=true\n' > /etc/wsl.conf"
          wsl --terminate Debian
          wsl -d Debian -u root -- bash -c "ps -p 1 -o comm=; systemctl is-system-running; true"
