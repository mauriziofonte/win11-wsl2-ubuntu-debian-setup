# Checks the facts the guide states, on real systems: see tests/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: the package repositories move even when this repository does not.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  PSSCRIPTANALYZER_VERSION: 1.24.0

jobs:
  lint:
    name: Lint (shell scripts and documents)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Gash (main), for the links and commands the guide uses
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mauriziofonte/gash
          ref: main
          path: .gash-main
          persist-credentials: false
      - name: Install shellcheck
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >>"$GITHUB_PATH"
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S info
      - name: Documents against the installers and Gash
        run: GASH_REPO=.gash-main python3 tests/check-docs.py

  powershell:
    name: PowerShell (lint, parse, dry run)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          $results = @(foreach ($dir in @("install", "tests/wsl")) { Invoke-ScriptAnalyzer -Path $dir -Recurse -Settings tests/PSScriptAnalyzerSettings.psd1 })
          $results | Format-Table -AutoSize -Wrap RuleName, Severity, ScriptName, Line, Message
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer: $($results.Count) finding(s)" }
      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in (Get-ChildItem -Path install, tests -Recurse -Filter *.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw "$($file.Name) does not parse in PowerShell $($PSVersionTable.PSVersion)" }
            Write-Host "ok - $($file.Name) parses in PowerShell $($PSVersionTable.PSVersion)"
          }
      - name: Unit tests of the WSL settings, in Windows PowerShell 5.1
        shell: powershell
        run: tests/powershell/unit.ps1
      - name: Unit tests of the WSL settings, in PowerShell 7
        shell: pwsh
        run: tests/powershell/unit.ps1
      - name: win11.ps1 -DryRun -Unattended, in Windows PowerShell 5.1
        shell: pwsh
        run: tests/powershell/dry-run.ps1

  wsl:
    name: WSL2 (${{ matrix.distro }}, ${{ matrix.case }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The defaults: Bash with Gash, Balanced profile, NAT, no disk limit.
          - { distro: Debian, case: defaults, options: "" }
          # A .wslconfig of your own, kept; a disk limit on an existing distribution; fish.
          - { distro: Ubuntu-24.04, case: "own .wslconfig, fish", options: "-PresetWslConfig -VmProfile Light -VhdSizeGB 20 -WslInitTimeout 45000 -Shell fish" }
          # Mirrored networking, no Windows PATH in Linux, Bash with fzf/zoxide/starship.
          - { distro: Ubuntu-26.04, case: "mirrored, bash-plus", options: "-VmProfile Performance -WslNetworking mirrored -WslAppendWindowsPath false -Shell bash-plus" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows setup end to end on a real WSL2
        shell: pwsh
        env:
          DISTRO: ${{ matrix.distro }}
          OPTIONS: ${{ matrix.options }}
        # The options are this workflow's own matrix values; an array splat would not bind them by name.
        run: Invoke-Expression "& tests/wsl/run.ps1 -Distro $env:DISTRO -LogDir `"$env:RUNNER_TEMP/logs`" $env:OPTIONS"
      - name: Collect the setup logs and the .wslconfig
        if: failure()
        shell: pwsh
        run: |
          Copy-Item -Path "$env:LOCALAPPDATA/WSL2Setup/*.log" -Destination "$env:RUNNER_TEMP/logs" -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:USERPROFILE/.wslconfig*" -Destination "$env:RUNNER_TEMP/logs" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: wsl-${{ matrix.distro }}-logs
          path: ${{ runner.temp }}/logs

  container:
    name: Plain machine (${{ matrix.image }}, ${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:13", scenario: minimal }
          - { image: "ubuntu:24.04", scenario: bash-plus }
          - { image: "ubuntu:26.04", scenario: zsh }
          - { image: "debian:13", scenario: fish }
          - { image: "ubuntu:24.04", scenario: manual }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The stack installer in a container with systemd
        env:
          IMAGE: mirror.gcr.io/library/${{ matrix.image }}
          SCENARIO: ${{ matrix.scenario }}
        run: LOG_DIR="$RUNNER_TEMP/logs" tests/container/run.sh "$IMAGE" "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: container-${{ strategy.job-index }}-logs
          path: ${{ runner.temp }}/logs
