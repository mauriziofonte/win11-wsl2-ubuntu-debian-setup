# Records the GIFs of the guide (docs/tapes/*.tape) with VHS on a Windows runner: a real, interactive
# run of the Windows setup on a real WSL2. A push to a branch other than main that changes a tape records
# them and commits them to that branch, so they reach main with the pull request that changed the tapes.
# Started by hand, it records them and commits them only with "commit" checked. The GIFs are also
# uploaded as an artifact.
name: Demos

on:
  push:
    branches-ignore: [main]
    paths:
      - "docs/tapes/**"
      - ".github/workflows/demos.yml"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the GIFs to the branch this runs on
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Record the GIFs
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      # Credentials stay only when the job commits the GIFs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name == 'push' || inputs.commit }}

      # Installs vhs, ttyd and ffmpeg; no tape is given here.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1

      - name: Record the tapes, in order
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/media | Out-Null
          # Minutes each tape may take: a Wait that never matches must not hold the job until its timeout.
          $tapes = [ordered]@{ "windows-options" = 10; "windows-setup" = 75; "first-site" = 15 }
          foreach ($tape in $tapes.Keys) {
            Write-Host "== $tape"
            $vhs = Start-Process -FilePath vhs -ArgumentList "docs/tapes/$tape.tape" -NoNewWindow -PassThru
            $null = $vhs.Handle
            if (-not $vhs.WaitForExit($tapes[$tape] * 60000)) {
              Stop-Process -Id $vhs.Id -Force
              throw "vhs docs/tapes/$tape.tape did not finish in $($tapes[$tape]) minutes"
            }
            if ($vhs.ExitCode -ne 0) { throw "vhs docs/tapes/$tape.tape failed with exit status $($vhs.ExitCode)" }
          }
          Get-ChildItem docs/media/*.gif | Format-Table Name, Length

      - name: Collect the setup logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/demo-logs" | Out-Null
          Copy-Item -Path "$env:LOCALAPPDATA/WSL2Setup/*.log", "$env:USERPROFILE/.wslconfig" -Destination "$env:RUNNER_TEMP/demo-logs" -ErrorAction SilentlyContinue
          # The end of each log goes in the job log too, where it can be read without the artifact.
          foreach ($log in @(Get-ChildItem "$env:RUNNER_TEMP/demo-logs/*.log" -ErrorAction SilentlyContinue)) {
            Write-Host "--- $($log.Name), last lines"
            Get-Content -LiteralPath $log.FullName -Tail 60
          }
          Write-Host "--- the stack installer's log in Debian, last lines"
          wsl.exe -d Debian -u root --exec sh -c 'tail -n 40 /home/*/.local/state/lamp-lapp-stack/install-*.log' 2>&1
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: demo-gifs
          path: |
            docs/media/*.gif
            ${{ runner.temp }}/demo-logs

      - name: Commit the GIFs
        if: github.event_name == 'push' || inputs.commit
        shell: pwsh
        run: |
          git add docs/media/*.gif
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "GIFs unchanged"; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record the setup GIFs"
          # The branch may have moved on while the tapes were recording: the GIFs go on top of it.
          for ($try = 1; $try -le 3; $try++) {
            git pull --rebase origin $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -eq 0) { git push origin "HEAD:$env:GITHUB_REF_NAME" }
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw "could not push the GIFs to $env:GITHUB_REF_NAME"
